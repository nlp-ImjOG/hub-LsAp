          text: '你是深度研究助手的关键词规划员。请把研究主题拆成 3-5 个具体、可直接用于搜索引擎的关键词，覆盖概念/背景、代表产品或主体、比较数据、趋势风险等不同角度。

            只输出 JSON，不要解释，不要 Markdown 代码块。格式：{"keywords":["关键词1","关键词2","关键词3"]}'
        - id: f3b41d0c-0a58-4f48-971b-e783fa88b101
          role: user
          text: 研究主题：{{#start.topic#}}
        selected: false
        title: 规划研究关键词
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: plan
      position:
        x: 222
