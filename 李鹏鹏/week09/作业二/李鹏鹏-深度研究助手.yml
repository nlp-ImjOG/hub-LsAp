          \    try:\n        obj = json.loads(match.group(0) if match else (text or\
          \ ''))\n    except Exception:\n        obj = {'sufficient': True, 'new_keywords':\
          \ []}\n    sufficient = bool(obj.get('sufficient', True))\n    known = {str(x).strip()\
          \ for x in (searched1 or []) + (searched2 or [])}\n    items = []\n    if\
          \ not sufficient:\n        for item in obj.get('new_keywords', []):\n  \
          \          value = str(item).strip()\n            if value and value not\
          \ in known and value not in items:\n                items.append(value)\n\
          \    return {'keywords': items[:3], 'sufficient': sufficient, 'reason':\
          \ str(obj.get('reason', ''))}"
