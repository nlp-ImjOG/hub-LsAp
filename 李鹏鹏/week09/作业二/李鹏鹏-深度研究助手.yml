    - data:
        code: "import json\n\ndef _loads(value):\n    if isinstance(value, dict):\n\
          \        return value\n    try:\n        return json.loads(value or '{}')\n\
          \    except Exception:\n        return {}\n\ndef _pages(body):\n    obj\
          \ = _loads(body)\n    return obj.get('data', {}).get('webPages', {}).get('value',\
          \ []) or []\n\ndef main(topic: str, keywords1: list, results1: list, notes1:\
          \ str,\n         judge1: str, keywords2: list, results2: list, notes2: str,\n\
          \         judge2: str, keywords3: list, results3: list) -> dict:\n    rounds\
          \ = [\n        (1, keywords1 or [], results1 or []),\n        (2, keywords2\
          \ or [], results2 or []),\n        (3, keywords3 or [], results3 or []),\n\
          \    ]\n    sources = []\n    seen = set()\n    material_rounds = []\n \
          \   searched = []\n    latest_dates = []\n    for number, keywords, bodies\
          \ in rounds:\n        if not keywords:\n            continue\n        entries\
          \ = []\n        for index, query in enumerate(keywords):\n            searched.append(str(query))\n\
          \            body = bodies[index] if index < len(bodies) else '{}'\n   \
          \         pages = _pages(body)\n            compact = []\n            for\
          \ page in pages:\n                url = str(page.get('url') or '').strip()\n\
          \                title = str(page.get('name') or page.get('title') or '').strip()\n\
          \                snippet = str(page.get('summary') or page.get('snippet')\
          \ or '').strip()[:1200]\n                site = str(page.get('siteName')\
          \ or '').strip()\n                date = str(page.get('datePublished') or\
          \ page.get('dateLastCrawled') or '').strip()\n                compact.append({'title':\
          \ title, 'url': url, 'site_name': site, 'date': date, 'snippet': snippet})\n\
          \                if date:\n                    latest_dates.append(date[:10])\n\
          \                if url and url not in seen:\n                    seen.add(url)\n\
          \                    sources.append({'id': len(sources) + 1, 'title': title,\
          \ 'url': url, 'site_name': site, 'date': date})\n            entries.append({'query':\
          \ str(query), 'results': compact})\n        material_rounds.append({'round':\
          \ number, 'queries': entries})\n    iterations = sum(1 for _, keys, _ in\
          \ rounds if keys)\n    level = 'high' if len(sources) >= 12 else ('medium'\
          \ if len(sources) >= 5 else 'low')\n    cutoff = max(latest_dates) if latest_dates\
          \ else '本次工作流运行时'\n    materials = {\n        'topic': topic,\n        'research_notes_round1':\
          \ notes1,\n        'research_notes_round2': notes2,\n        'search_materials':\
          \ material_rounds,\n        'sources': sources,\n    }\n    process = {\n\
          \        'plan': keywords1 or [],\n        'search_queries': searched,\n\
          \        'reviewed_urls': [item['url'] for item in sources],\n        'iterations':\
          \ iterations,\n        'round1_judgement': judge1,\n        'round2_judgement':\
          \ judge2,\n    }\n    confidence = {\n        'overall': level,\n      \
          \  'info_cutoff': cutoff,\n        'notes': [\n            '置信度按去重来源数量确定：12\
          \ 个及以上为 high，5-11 个为 medium，否则为 low。',\n            '未能关联真实来源 URL 的结论必须标注为“模型推断”。'\n\
          \        ]\n    }\n    return {\n        'materials': json.dumps(materials,\
          \ ensure_ascii=False),\n        'sources': json.dumps(sources, ensure_ascii=False),\n\
          \        'process': json.dumps(process, ensure_ascii=False),\n        'confidence':\
          \ json.dumps(confidence, ensure_ascii=False),\n    }"
        code_language: python3
        desc: 解析三轮搜索响应，来源按 URL 去重，并确定性生成研究过程和置信度。
