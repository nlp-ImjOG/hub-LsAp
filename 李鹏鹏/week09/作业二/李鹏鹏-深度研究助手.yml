      positionAbsolute:
        x: 222
        y: 257
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "import json\nimport re\n\ndef main(text: str, topic: str) -> dict:\n\
          \    raw = (text or '').strip()\n    match = re.search(r'\\{[\\s\\S]*\\\
          }', raw)\n    try:\n        obj = json.loads(match.group(0) if match else\
          \ raw)\n        items = obj.get('keywords', [])\n    except Exception:\n\
          \        items = []\n    cleaned = []\n    for item in items:\n        value\
          \ = str(item).strip()\n        if value and value not in cleaned:\n    \
          \        cleaned.append(value)\n    if not cleaned:\n        cleaned = [topic.strip()]\n\
          \    return {'keywords': cleaned[:5]}"
        code_language: python3
        desc: 容错解析规划模型输出；解析失败时直接使用原主题。
        outputs:
          keywords:
            children: null
            type: array[string]
        selected: false
