    - data:
        code: "import json\nimport re\n\ndef main(text: str, searched: list) -> dict:\n\
          \    match = re.search(r'\\{[\\s\\S]*\\}', text or '')\n    try:\n     \
          \   obj = json.loads(match.group(0) if match else (text or ''))\n    except\
          \ Exception:\n        obj = {'sufficient': False, 'new_keywords': []}\n\
          \    sufficient = bool(obj.get('sufficient', False))\n    known = {str(x).strip()\
          \ for x in (searched or [])}\n    items = []\n    if not sufficient:\n \
          \       for item in obj.get('new_keywords', []):\n            value = str(item).strip()\n\
          \            if value and value not in known and value not in items:\n \
          \               items.append(value)\n    return {'keywords': items[:3],\
          \ 'sufficient': sufficient, 'reason': str(obj.get('reason', ''))}"
