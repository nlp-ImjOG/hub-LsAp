<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多模态 RAG 问答</title>
  <style>
    body { font-family: -apple-system, "Microsoft YaHei", sans-serif; max-width: 900px; margin: 0 auto; padding: 24px; color: #333; }
    h1 { font-size: 22px; }
    .panel { border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .panel h2 { font-size: 16px; margin: 0 0 12px; }
    button { padding: 8px 16px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; }
    .status { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; color: #fff; }
    .pending { background: #9ca3af; }
    .processing { background: #2563eb; }
    .done { background: #16a34a; }
    .failed { background: #dc2626; }
    textarea { width: 100%; height: 80px; border: 1px solid #ddd; border-radius: 6px; padding: 8px; font-size: 14px; }
    #answer { white-space: pre-wrap; background: #f8fafc; border: 1px solid #eee; border-radius: 6px; padding: 12px; min-height: 40px; }
    #answerImages { margin-top: 8px; }
    #answerImages img { max-width: 260px; margin: 6px; border-radius: 6px; border: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>多模态 RAG 问答（Kafka + Redis + ES + mineru）</h1>

  <div class="panel">
    <h2>1. 上传 PDF（可多选，走 Kafka 异步解析）</h2>
    <input type="file" id="pdfInput" multiple accept=".pdf">
    <button id="uploadBtn">上传并解析</button>
  </div>

  <div class="panel">
    <h2>2. 解析状态</h2>
    <table>
      <thead><tr><th>文件</th><th>状态</th><th>错误信息</th></tr></thead>
      <tbody id="statusBody"><tr><td colspan="3">暂无记录</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>3. 多模态问答（支持图片 + 文本一起提问）</h2>
    <textarea id="question" placeholder="输入你的问题…"></textarea>
    <input type="file" id="imageInput" accept="image/*">
    <br><br>
    <button id="askBtn">提问</button>
    <div style="margin-top:12px"><strong>回答：</strong></div>
    <div id="answer"></div>
    <div id="answerImages"></div>
  </div>

  <script>
    const STATUS_TEXT = { pending: "待解析", processing: "解析中", done: "解析完成", failed: "失败" };

    async function refreshStatus() {
      const res = await fetch('/api/documents');
      const data = await res.json();
      const body = document.getElementById('statusBody');
      if (!data.documents.length) {
        body.innerHTML = '<tr><td colspan="3">暂无记录</td></tr>';
        return;
      }
      body.innerHTML = data.documents.map(d => `
        <tr>
          <td>${d.filename || ''}</td>
          <td><span class="status ${d.status || ''}">${STATUS_TEXT[d.status] || d.status}</span></td>
          <td>${d.error || ''}</td>
        </tr>`).join('');
    }

    document.getElementById('uploadBtn').onclick = async () => {
      const input = document.getElementById('pdfInput');
      if (!input.files.length) { alert('请先选择 PDF 文件'); return; }
      const fd = new FormData();
      for (const f of input.files) fd.append('files', f);
      await fetch('/api/upload', { method: 'POST', body: fd });
      input.value = '';
      refreshStatus();
    };

    async function fileToDataURL(file) {
      return new Promise(resolve => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.readAsDataURL(file);
      });
    }

    document.getElementById('askBtn').onclick = async () => {
      const question = document.getElementById('question').value.trim();
      if (!question) { alert('请输入问题'); return; }
      const images = [];
      const imgFile = document.getElementById('imageInput').files[0];
      if (imgFile) images.push(await fileToDataURL(imgFile));

      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, images })
      });
      const data = await res.json();
      document.getElementById('answer').textContent = data.answer || '';
      document.getElementById('answerImages').innerHTML =
        (data.images || []).map(u => `<img src="${u}">`).join('');
    };

    refreshStatus();
    setInterval(refreshStatus, 2000);
  </script>
</body>
</html>
