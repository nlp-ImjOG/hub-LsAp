    - data:
        code: "import json\nimport re\n\n\ndef main(text: str) -> dict:\n    # 去掉推理模型输出的思考块\n\
          \    text = re.sub(r\"<think>.*?</think>\", \"\", text, flags=re.S)\n  \
          \  text = text.replace(\"<!--dify-deepseek-reasoning-->\", \"\")\n\n   \
          \ # 优先提取 ```json ... ``` 代码块\n    m = re.search(r\"```json\\s*(.*?)```\"\
          , text, re.S)\n    raw = (m.group(1) if m else text).strip()\n\n    kws\
          \ = []\n    try:\n        data = json.loads(raw)\n        kws = data.get(\"\
          keywords\", []) if isinstance(data, dict) else []\n    except Exception:\n\
          \        # 解析不到 JSON 时，按行兜底\n        kws = [l.strip(\" -•*\\\"'，,\") for\
          \ l in raw.split(\"\\n\")]\n        kws = [k for k in kws if k and not k.startswith(\"\
          {\")]\n\n    kws = [str(k).strip() for k in kws if str(k).strip()]\n   \
          \ return {\"keywords\": kws}"
        code_language: python3
        desc: 解析关键词
