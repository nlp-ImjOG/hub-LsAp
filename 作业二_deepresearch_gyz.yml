    - data:
        code: "import re\n\ndef main(drafts: list) -> dict:\n      blocks = [b.strip()\
          \ for b in (drafts or []) if b and b.strip()]\n      material = \"\\n\\\
          n\".join(blocks)\n\n      # 正则抽出所有 [标题](URL)，按 URL 去重\n      pairs = re.findall(r\"\
          - \\[(.*?)\\]\\((https?://[^\\s)]+)\\)\", material)\n      seen, sources\
          \ = set(), []\n      for title, url in pairs:\n          if url not in seen:\n\
          \              seen.add(url)\n              sources.append(f\"- {title}：{url}\"\
          )\n\n      return {\n          \"material\": material,\n          \"sources\"\
          : \"\\n\".join(sources),\n          \"source_count\": len(sources),\n  \
          \    }"
        code_language: python3
        outputs:
