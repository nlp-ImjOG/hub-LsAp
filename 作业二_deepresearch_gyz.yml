        prompt_template:
        - id: 7933c70d-fab6-45bf-a7c1-1405348c5980
          role: system
          text: "你是「深度研究助手」中的关键词规划员。你的职责是把一个研究主题拆解成若干可直接检索的关键词，供搜索引擎检索。\n\n  ## 要求\n\
            \  - 生成 3-5 个关键词，覆盖主题的不同子角度（概念、行业/市场、代表产品与对比、技术/数据、趋势/结论等）。\n  - 每个关键词应当具体、可检索，能返回与该子角度直接相关的结果，可包含年份或具体实体以聚焦。\n\
            \  - 关键词彼此区分度要高，不要互相重复或只是同一语义的换说法。\n\n  ## 输出\n  只输出一个 JSON 对象，用 ```json\
            \ ... ``` 代码块包裹，格式如下：\n  {\"keywords\": [\"关键词1\", \"关键词2\", \"关键词3\"\
            ]}\n  不要输出 JSON 以外的任何解释文字。"
        - id: 101fa104-14a3-4861-b36c-dd1706c7dd96
          role: user
          text: 研究主题：{{#1789485519642.topic#}}
        selected: false
        title: 关键词规划
        type: llm
        vision:
          enabled: false
      height: 116
