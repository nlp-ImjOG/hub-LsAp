    - data:
        code: "import ast\nimport re\n\ndef main(crawl_result: str):\n    try:\n \
          \       marker = \"TEXT:\\n\\n\"\n        idx = crawl_result.find(marker)\n\
          \        if idx == -1:\n            return {\"crawl_text\": \"\"}\n\n  \
          \      raw_text = crawl_result[idx + len(marker):]\n        # 重点：用ast.literal_eval代替json.loads解析单引号的list/dict\n\
          \        item_list = ast.literal_eval(raw_text)\n\n        content_parts\
          \ = []\n        for item in item_list:\n            val = item.get(\"text\"\
          , \"\")\n            if val:\n                # 清除html标签\n             \
          \   clean_val = re.sub(r'<[^>]+>', '', val)\n                content_parts.append(clean_val)\n\
          \        full_content = \"\\n\".join(content_parts)\n\n    except Exception\
          \ as e:\n        print(e)\n        full_content = \"\"\n\n    return {\n\
          \        \"crawl_text\": full_content\n    }"
        code_language: python3
        desc: ''
        isInIteration: true
        isInLoop: false
        iteration_id: '17897083162153'
        outputs:
          crawl_text:
            children: null
            type: string
