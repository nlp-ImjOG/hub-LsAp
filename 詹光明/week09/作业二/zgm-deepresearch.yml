            要求：

            1. 根据资料总结生成一份关于用户提问的研究报告；

            2. 根据资料进行总结：把来自不同子问题的信息合并、重组，按逻辑组织，不要直接将所有总结原样拼接在一起；

            3. 去重：多个子问题里重复出现的信息只讲一次；

            4. 保留来源：如果总结里带了来源链接，在报告中对应的结论需要保留引用；

            5. 严禁胡编乱造：基于给的资料进行总结，不要臆造；

            6. 报告框架按总分总的格式，先总述回答原问题，然后分几个方面展开，结尾再进行总结'
