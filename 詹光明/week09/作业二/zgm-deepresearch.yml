            输出要求：

            1. 基于输入的内容进行输出，不要编造输入里没有的信息；

            2. 去重合并：同网页可能说同一件事，要合并，不要重复罗列；

            3. 保留关键信息：核心事实、机制、数据、不同观点都要留下；

            4. 保留来源：在关键结论后附上对应链接；

            5. 字数控制在300字以内。'
