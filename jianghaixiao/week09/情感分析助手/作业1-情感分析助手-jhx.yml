    - data:
        classes:
        - id: '1'
          label: 正向情感
          name: '定义：

            文本对某人、某事、某物表达积极态度或积极情绪，包括喜欢、满意、赞美、感谢、支持、期待、感动、认可、推荐等。

            常见主题/场景：

            好评、夸奖、感谢、推荐、复购、祝福、鼓励、满意、惊喜、期待、支持、认同。

            判定信号：

            很好、喜欢、满意、谢谢、赞、推荐、期待、棒、暖心、给力、爱了、不错、优秀、感动、支持。

            示例：

            “这家店服务很好，下次还来。”

            “谢谢你的帮助，真的很暖心。”

            “虽然等了很久，但结果很满意。”

            → 主导是正向，归正向。

            边界规则：

            反讽不算正向：“真是太好了，又加班到凌晨。”实际是负向。

            混合情感看主导：正负都有但正向明显更强，归正向。

            纯事实不一定正向：“发货很快”如果只是陈述，可能中性；如果表达满意，则正向。'
        - id: '2'
          label: 负向情感
          name: '定义：

            文本表达消极态度或消极情绪，包括不满、愤怒、失望、焦虑、悲伤、厌恶、批评、嘲讽、痛苦、投诉等。

            常见主题/场景：

            差评、吐槽、投诉、维权、退款、抱怨、批评、愤怒、失望、焦虑、崩溃、无语、避雷。

            判定信号：

            差、烂、恶心、失望、无语、崩溃、投诉、退款、再也不、垃圾、坑、服了、气死、难受、避雷。

            示例：

            “太差了，客服一直不回复。”

            “很失望，不会再买。”

            “真是服了，又出问题。”

            边界规则：

            反讽按真实情感判：“真棒，又坏了。”→ 负向。

            疑问可能中性，也可能负向：“为什么还没到？”如果只是询问，中性；如果明显抱怨，负向。

            混合情感看主导：负向明显更强，归负向。'
        - id: '1789485050017'
          label: 其他或中性
          name: '定义：

            没有明显情感倾向，或情感极弱、无法判断、正负混合且无主导、与情感评价无关的内容。

            常见主题/场景：

            事实陈述、知识问答、操作指令、一般疑问、客观描述、时间地点数字、无评价、混合无主导、无法判断、与情感无关。

            判定信号：

            是、有、在、时间、地点、数字、步骤、请问、如何、是否、客观描述，无明显褒贬。

            示例：

            “手机重量 200 克。”

            “明天几点开会？”

            “我收到了快递。”

            “既不好也不坏。”

            “A 比 B 重 10 克。”

            边界规则：

            正负混合且强度相当：归“其他或中性”。

            情感很弱：“还行”“一般”可归中性，也可按业务规则归弱正向，但必须统一。

            无法判断、信息不足：归“其他或中性”。'
        instruction: '只判断用户当前表达的整体情感，不回答用户问题。

          正向、负向、其他或中性三选一。

          只输出类别名称。'
