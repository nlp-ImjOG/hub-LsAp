<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>楼道消防隐患识别</title>
<style>
  body { margin: 0; background: #F7F6F3; color: #1F1F1F; font: 15px/1.6 -apple-system, "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: #FFF; border: 1px solid rgba(0,0,0,.1); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .stage { aspect-ratio: 4/3; background: #EFEEE9; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #6B6A65; }
  img { width: 100%; height: 100%; object-fit: contain; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button, .btn { border: 1px solid rgba(0,0,0,.1); background: #FFF; border-radius: 9px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
  .primary { background: #185FA5; border-color: #185FA5; color: #FFF; }
  .primary[disabled] { opacity: .45; cursor: not-allowed; }
  .badge { display: inline-block; padding: 6px 14px; border-radius: 99px; font-weight: 600; }
  ul { padding-left: 18px; margin: 6px 0; }
  .meta { color: #8C8B86; font-size: 12px; margin-top: 12px; }
  #tip { color: #854F0B; background: #FAEEDA; padding: 9px 11px; border-radius: 8px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>楼道消防隐患识别</h1>

  <div class="card">
    <div class="stage">
      <img id="preview" hidden>
      <span id="ph">尚未选择图片</span>
    </div>
    <div class="row">
      <label class="btn primary" for="file">选择图片</label>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
      <button id="btnGo" disabled>开始识别</button>
    </div>
    <div id="tip" hidden></div>
  </div>

  <div class="card" id="result" hidden>
    <span class="badge" id="badge"></span>
    <div id="body"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script>
const STYLE = {
  "高风险": ["#A32D2D", "#FCEBEB"], "中风险": ["#854F0B", "#FAEEDA"],
  "低风险": ["#3B6D11", "#EAF3DE"], "无风险": ["#0F6E56", "#E1F5EE"],
  "非楼道": ["#5F5E5A", "#F1EFE8"], "识别失败": ["#A32D2D", "#FCEBEB"]
};
const $ = id => document.getElementById(id);
let blob = null;

$("file").onchange = e => {
  blob = e.target.files[0];
  if (!blob) return;
  $("preview").src = URL.createObjectURL(blob);
  $("preview").hidden = false;
  $("ph").hidden = true;
  $("btnGo").disabled = false;
};

$("btnGo").onclick = async () => {
  const form = new FormData();
  form.append("file", blob);
  $("btnGo").disabled = true;
  $("btnGo").textContent = "识别中…";
  const t0 = performance.now();
  try {
    const r = await fetch("/api/analyze", { method: "POST", body: form });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);

    const [color, bg] = STYLE[d.risk_level] || STYLE["识别失败"];
    $("badge").textContent = d.risk_level;
    $("badge").style.color = color;
    $("badge").style.background = bg;
    $("body").innerHTML =
      "<p>置信度：" + Math.round((d.confidence || 0) * 100) + "%</p>" +
      (d.hazards.length ? "<b>隐患项</b><ul>" + d.hazards.map(h => "<li>" + h + "</li>").join("") + "</ul>" : "") +
      (d.evidence.length ? "<b>判断依据</b><ul>" + d.evidence.map(h => "<li>" + h + "</li>").join("") + "</ul>" : "") +
      (d.suggestion ? "<b>处置建议</b><p>" + d.suggestion + "</p>" : "");
    $("meta").textContent = d.model + " · " + Math.round(performance.now() - t0) + " ms";
    $("result").hidden = false;
    $("tip").hidden = true;
  } catch (e) {
    $("tip").textContent = "识别失败：" + e.message;
    $("tip").hidden = false;
  } finally {
    $("btnGo").disabled = false;
    $("btnGo").textContent = "开始识别";
  }
};
</script>
</body>
</html>
