          \                seen.add(url)\n                lines.append(f\"标题：{page.get('name','')}\\\
          nURL：{url}\\n摘要：{page.get('summary','') or page.get('snippet','')}\\n\"\
          )\n    new_text = \"\\n\".join(lines)\n    combined = (previous_draft or\
          \ \"\") + \"\\n\" + new_text\n    return {\"new_draft\": combined}"
