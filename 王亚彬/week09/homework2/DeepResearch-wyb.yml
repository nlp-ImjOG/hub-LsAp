          \ item in results:\n            if not isinstance(item, str):\n        \
          \        continue\n            try:\n                data = json.loads(item)\n\
          \            except Exception:\n                continue\n            pages\
          \ = []\n            if \"data\" in data and isinstance(data[\"data\"], dict):\n\
          \                pages = data[\"data\"].get(\"webPages\", {}).get(\"value\"\
          , [])\n            for page in pages:\n                url = page.get(\"\
