            判断标准：

            - 表达开心、满意、感谢、期待、顺利、赞美 → 输出 正面

            - 表达难过、生气、焦虑、失望、抱怨、疲惫 → 输出 负面

            - 无法判断 → 输出 无法判断


            只输出上面三个词中的一个，不要标点、不要解释、不要复述原文、不要 JSON。


            用户输入：

            {{#sys.query#}}'
