app:
  description: '作业1: 使用dify 搭建一个情感分析助手， 如果用户输入的是正向情感，则给用户做一个输出，希望你明天也很开心。

    如果用户输入的一个负面情感，则对用户的困扰进行解答，并输出建议。需要使用chatflow 搭建，并运行截图，提交最终dsl。'
