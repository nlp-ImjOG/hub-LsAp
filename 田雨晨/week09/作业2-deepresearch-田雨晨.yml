    - data:
        code: "import json\nimport re\n\n\ndef _to_list(x):\n    if isinstance(x,\
          \ str):\n        try:\n            x = json.loads(x)\n        except Exception:\n\
          \            x = [x]\n    if isinstance(x, dict):\n        x = x.get(\"\
          notes\") or x.get(\"summaries\") or list(x.values())\n    if not isinstance(x,\
          \ list):\n        x = [x]\n    return x\n\n\ndef main(arg1) -> dict:\n \
          \   notes = _to_list(arg1)\n\n    parts, total = [], 0\n    for i, n in\
          \ enumerate(notes, 1):\n        if isinstance(n, dict):\n            n =\
          \ n.get(\"note\") or n.get(\"text\") or json.dumps(n, ensure_ascii=False)\n\
          \        s = str(n).strip()\n        if not s:\n            continue\n \
          \       # 该子问题笔记中最大的来源编号 ≈ 该子问题检索到的网页条数\n        idx = [int(m) for m in\
          \ re.findall(r\"\\[(\\d+)\\]\", s)]\n        total += max(idx) if idx else\
          \ 0\n        parts.append(\"### 子问题 {}\\n{}\".format(i, s))\n\n    evidence\
          \ = \"\\n\\n\".join(parts) or \"（本次未获得有效笔记）\"\n    return {\"evidence\"\
          : evidence[:60000], \"total_sources\": total}"
