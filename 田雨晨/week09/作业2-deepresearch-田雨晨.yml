    - data:
        code: "import json\n\ndef main(arg1) -> dict:\n    # 兼容 body 是 str / dict\n\
          \    d = arg1\n    if isinstance(d, str):\n        s = d.strip()\n     \
          \   if s.startswith(\"```\"):\n            s = s.strip(\"`\").strip()\n\
          \        try:\n            d = json.loads(s)\n        except Exception:\n\
          \            return {\"webtext\": s[:8000] or \"解析失败\", \"n_sources\": 0,\
          \ \"urls\": []}\n    if not isinstance(d, dict):\n        return {\"webtext\"\
          : str(d)[:8000], \"n_sources\": 0, \"urls\": []}\n\n    # 兼容几种可能的路径\n  \
          \  pages = []\n    for path in ((\"data\", \"webPages\", \"value\"),\n \
          \                (\"data\", \"web_pages\", \"value\"),\n               \
          \  (\"webPages\", \"value\"),\n                 (\"data\", \"value\")):\n\
          \        cur = d\n        ok = True\n        for k in path:\n          \
          \  if isinstance(cur, dict) and k in cur:\n                cur = cur[k]\n\
          \            else:\n                ok = False\n                break\n\
          \        if ok and isinstance(cur, list):\n            pages = cur\n   \
          \         break\n\n    buf, urls = [], []\n    for i, p in enumerate(pages[:10],\
          \ 1):\n        if not isinstance(p, dict):\n            continue\n     \
          \   title = p.get(\"name\") or p.get(\"title\") or \"\"\n        url   =\
          \ p.get(\"url\") or p.get(\"link\") or \"\"\n        body  = p.get(\"summary\"\
          ) or p.get(\"snippet\") or p.get(\"content\") or \"\"\n        date  = p.get(\"\
          dateLastCrawled\") or p.get(\"datePublished\") or \"\"\n        if url:\n\
          \            urls.append(url)\n        buf.append(f\"[{i}] {title}\\nURL:\
          \ {url}\\n时间: {date}\\n内容: {body}\")\n\n    return {\n        \"webtext\"\
          : \"\\n\\n\".join(buf)[:12000] or \"本子问题无有效搜索结果\",\n        \"n_sources\"\
          : len(urls),\n        \"urls\": urls,\n    }"
