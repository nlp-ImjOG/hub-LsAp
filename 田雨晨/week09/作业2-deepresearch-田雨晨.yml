    - data:
        code: "import json\nimport re\n\n\ndef _strip(s):\n    try:\n        s = re.sub(r\"\
          <think[\\s\\S]*?</think\\s*>\", \"\", s, flags=re.I)\n        s = re.sub(r\"\
          <thinking[\\s\\S]*?</thinking\\s*>\", \"\", s, flags=re.I)\n        s =\
          \ re.sub(r\"<!--[\\s\\S]*?-->\", \"\", s)\n        s = s.replace(\"```json\"\
          , \"\").replace(\"```\", \"\")\n    except Exception:\n        pass\n  \
          \  return s.strip()\n\n\ndef _fragment(s):\n    i, j = s.find(\"{\"), s.rfind(\"\
          }\")\n    if i != -1 and j > i:\n        return s[i:j + 1]\n    i, j = s.find(\"\
          [\"), s.rfind(\"]\")\n    if i != -1 and j > i:\n        return s[i:j +\
          \ 1]\n    return s\n\n\ndef _load(frag):\n    cands = [frag]\n    try:\n\
          \        cands.append(re.sub(r\",\\s*([}\\]])\", r\"\\1\", frag))      \
          \    # 去尾逗号\n        cands.append(re.sub(r\",\\s*([}\\]])\", r\"\\1\",\n\
          \                            frag.replace(\"\\u201c\", '\"').replace(\"\\\
          u201d\", '\"')))  # 再修中文引号\n    except Exception:\n        pass\n    for\
          \ c in cands:\n        try:\n            return json.loads(c)\n        except\
          \ Exception:\n            continue\n    return None\n\n\ndef main(arg1)\
          \ -> dict:\n    try:\n        raw = arg1 if isinstance(arg1, str) else json.dumps(arg1,\
          \ ensure_ascii=False)\n    except Exception:\n        raw = str(arg1)\n\n\
          \    if not raw:\n        return {\"questions\": [\"__EMPTY_INPUT__ 上游未传值\"\
          ],\n                \"count\": 1, \"status\": \"empty_input\", \"raw_len\"\
          : 0, \"raw_head\": \"\"}\n\n    text = _strip(raw)\n    data = _load(_fragment(text))\n\
          \n    if isinstance(data, dict):\n        for k in (\"questions\", \"sub_questions\"\
          , \"items\", \"list\", \"queries\"):\n            if isinstance(data.get(k),\
          \ list):\n                data = data[k]\n                break\n      \
          \  else:\n            data = [v for v in data.values() if isinstance(v,\
          \ (str, dict))]\n\n    qs = []\n    if isinstance(data, list):\n       \
          \ for x in data:\n            if isinstance(x, dict):\n                q\
          \ = x.get(\"question\") or x.get(\"q\") or x.get(\"query\") or \"\"\n  \
          \          else:\n                q = x\n            q = str(q).strip().strip('\"\
          \\'-,，•·、')\n            if q:\n                qs.append(q)\n\n    if not\
          \ qs:                                    # 兜底一：按行切\n        for line in\
          \ text.splitlines():\n            t = line.strip().lstrip(\"0123456789.、)-•\
          \ \").strip()\n            if t and not t.startswith((\"{\", \"}\", \"[\"\
          , \"]\", '\"')):\n                qs.append(t)\n\n    if not qs:       \
          \                             # 兜底二：给可见标记，绝不空手而归\n        qs = [\"__PARSE_FAIL__\
          \ \" + text[:60]]\n\n    qs = qs[:5]\n    return {\n        \"questions\"\
          : qs,\n        \"count\": len(qs),\n        \"status\": \"ok\",\n      \
          \  \"raw_len\": len(raw),\n        \"raw_head\": text[:80],\n    }"
        code_language: python3
