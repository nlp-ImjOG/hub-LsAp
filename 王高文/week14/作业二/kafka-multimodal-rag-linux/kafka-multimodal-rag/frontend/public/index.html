<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 知识库</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead"><span class="mark" aria-hidden="true">▤</span><span>PDF 知识库</span></header>
  <main class="workspace">
    <aside class="panel library" aria-labelledby="library-title">
      <h2 id="library-title">文档</h2>
      <form id="upload-form">
        <label id="drop-zone" class="drop-zone" for="pdfs">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <strong id="selection">选择或拖入 PDF</strong>
          <span>可同时上传最多 10 份</span>
        </label>
        <input id="pdfs" name="files" type="file" accept=".pdf,application/pdf" multiple class="visually-hidden">
        <button id="upload-button" type="submit" disabled>上传文档</button>
        <div id="upload-feedback" role="status" class="feedback"></div>
      </form>
      <div id="document-list" aria-live="polite"></div>
    </aside>
    <section class="panel chat" aria-labelledby="chat-title">
      <div class="chat-heading"><h1 id="chat-title">知识库问答</h1><p>用文字或图片提问，查看 PDF 原图和出处。</p></div>
      <div id="messages" role="log" aria-label="问答记录" tabindex="0">
        <div id="chat-empty" class="chat-empty">上传一份带图的 PDF，然后问「文档里这张图说明了什么？」</div>
      </div>
      <form id="ask-form" class="composer">
        <label class="visually-hidden" for="question">提问</label>
        <textarea id="question" name="question" placeholder="输入你的问题…" rows="2" maxlength="4000" required></textarea>
        <div class="composer-actions">
          <label for="image" class="attach-button">＋ 添加图片</label>
          <input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp" class="visually-hidden">
          <span id="attachment-name" class="attachment-name" hidden></span>
          <button id="clear-image" type="button" class="quiet" hidden aria-label="移除图片">×</button>
          <button id="ask-button" type="submit">发送</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
