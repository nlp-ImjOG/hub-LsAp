    - data:
        instruction: "请分析用户输入的研究主题，并生成3～5个可以独立搜索的研究子问题。\n\n拆解规则：\n1. 每个子问题必须具体、明确，并且能够单独通过搜索引擎检索。\n\
          2. 子问题之间不能重复或只是换一种说法。\n3. 优先覆盖以下角度：\n   - 基本概念和背景；\n   - 核心方法或组成部分；\n  \
          \ - 关键数据、市场现状或实际应用；\n   - 优势、局限、风险或争议；\n   - 最新发展趋势。\n4. 根据主题选择适合的角度，不要机械地覆盖所有角度。\n\
          5. 如果用户的问题涉及“最新”“当前”“近期”，在子问题中加入明确的时间范围。\n6. 每个数组元素只能包含一个完整问句。\n7. 不要添加数字序号、前缀、解释、答案或\
          \ Markdown。\n8. 必须生成至少3个、最多5个子问题。\n\n示例：\n\n用户输入：\n机器学习\n\nsub_questions：\n\
          [\n  \"机器学习的基本定义和核心原理是什么？\",\n  \"监督学习、无监督学习和强化学习分别适用于哪些场景？\",\n  \"机器学习中常见的算法和模型评估方法有哪些？\"\
          ,\n  \"机器学习目前主要应用于哪些行业？\",\n  \"机器学习当前面临哪些局限和发展趋势？\"\n]"
