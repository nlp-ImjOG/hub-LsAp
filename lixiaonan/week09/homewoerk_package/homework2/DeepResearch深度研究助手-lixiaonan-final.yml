          max_write_timeout: 600
          read: 600
          write: 600
        title: 博查搜索
        type: http-request
        url: https://api.bocha.cn/v1/web-search
        variables: []
      height: 181
      id: http_search
      parentId: iteration_research
      position:
        x: 271.49527430996
        y: 116.3132780145076
      positionAbsolute:
        x: 1231.49527430996
        y: 256.3132780145076
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 1002
    - data:
        code: "import json\n\ndef main(body: str) -> dict:\n    try:\n        data\
          \ = json.loads(body)\n    except Exception:\n        return {\"result\"\
          : \"\"}\n    pages = (data.get(\"data\") or {}).get(\"webPages\", {}).get(\"\
          value\") or []\n    lines = []\n    for i, p in enumerate(pages[:10], 1):\n\
          \        name = p.get(\"name\", \"\")\n        url = p.get(\"url\", \"\"\
          )\n        summary = p.get(\"summary\") or p.get(\"snippet\") or \"\"\n\
          \        if summary:\n            lines.append(f\"{i}. {name}\\n   链接: {url}\\\
          n   摘要: {summary}\")\n    return {\"result\": \"\\n\\n\".join(lines) if\
          \ lines else \"\"}\n"
        code_language: python3
        desc: 从博查响应 JSON 中提取 标题/链接/摘要 文本
        isInIteration: true
        isInLoop: false
        iteration_id: iteration_research
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 提取搜索结果
        type: code
        variables:
        - value_selector:
          - http_search
          - body
          variable: body
