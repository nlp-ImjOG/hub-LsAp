    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 将研究问题分解为 3-5 个搜索子查询，输出 JSON 数组
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: qwen3.7-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: f2000000-0000-4000-8000-000000000001
          role: system
          text: '你是深度研究助手的问题规划器。请把用户的研究问题分解为 3-5 个互补的搜索查询词：

            - 覆盖问题的不同侧面（如：背景与定义、现状与关键数据、对比分析、典型案例、最新进展与趋势）；

            - 每个查询词是简短的中文搜索短语（8-20字），适合搜索引擎检索；

            - 只输出一个 JSON 字符串数组，例如：["新能源汽车 2026 市场规模","新能源汽车 销量数据 2026","新能源汽车 行业趋势分析"]

            - 不要输出任何解释文字，不要输出 markdown 代码块。

            '
        - id: f2000000-0000-4000-8000-000000000002
          role: user
          text: '{{#start_node.query#}}'
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 1000
        selected: false
        structured_output: {}
        structured_output_enabled: false
        title: 问题分解
        type: llm
        vision:
          enabled: false
      height: 132
      id: llm_plan
      position:
        x: 360
        y: 280
      positionAbsolute:
        x: 360
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\nimport re\n\ndef main(text: str) -> dict:\n    t = (text\
          \ or \"\").strip()\n    # 去掉可能存在的 markdown 代码块包裹\n    t = re.sub(r'^```(?:json)?\\\
          s*', '', t)\n    t = re.sub(r'\\s*```$', '', t).strip()\n    m = re.search(r'\\\
          [.*\\]', t, re.S)\n    if m:\n        t = m.group(0)\n    try:\n       \
          \ arr = json.loads(t)\n    except Exception:\n        # 兜底：解析失败则用原始问题整句搜索，保证流程不断\n\
          \        arr = [(text or \"\").strip()]\n    queries = [str(x).strip() for\
          \ x in arr if str(x).strip()][:5]\n    if not queries:\n        queries\
          \ = [\"\"]\n    return {\"queries\": queries}\n"
        code_language: python3
        desc: 解析 LLM 输出的 JSON 数组为查询列表（带兜底）
        outputs:
          queries:
            children: null
            type: array[string]
        selected: false
        title: 解析查询
        type: code
        variables:
        - value_selector:
          - llm_plan
          - text
          variable: text
      height: 96
      id: code_parse
      position:
        x: 664.0348086682786
        y: 280
      positionAbsolute:
        x: 664.0348086682786
        y: 280
