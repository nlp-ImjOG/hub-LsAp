          - id: bocha-body-json
            key: sk-3b0d872fc2e046049ee9b0b02437ba77
            type: text
            value: '{"query": "{{#iteration_research.item#}}", "summary": true, "count":
              10}'
          type: json
        desc: 调用博查 web-search，query 为当前迭代子查询
        headers: 'Authorization:Bearer sk-3d2293ad83aa4823a7c7ce8dd5ff8c72

          Content-Type:application/json'
        isInIteration: true
        isInLoop: false
        iteration_id: iteration_research
        method: post
