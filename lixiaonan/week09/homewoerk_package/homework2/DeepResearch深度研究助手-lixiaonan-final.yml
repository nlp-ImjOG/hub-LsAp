    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 基于搜索结果生成该子问题的研究小结
        isInIteration: true
        isInLoop: false
        iteration_id: iteration_research
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: qwen3.7-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: f2000000-0000-4000-8000-000000000003
          role: system
          text: '你是研究助理。针对给定的子问题，从网页搜索结果中提取有效信息并形成一段客观小结。


            要求：

            1. 优先使用搜索结果中的 summary 字段，其次 snippet；

            2. 提炼与子问题直接相关的事实、数据、观点，保留关键数字与结论；

            3. 在小结末尾列出2-3条主要来源（标题 + URL）；

            4. 用中文输出，150-250字；

            5. 若搜索结果与子问题无关或为空，只输出：未找到与该子问题相关的有效信息。

            '
        - id: f2000000-0000-4000-8000-000000000004
          role: user
          text: '子问题：{{#iteration_research.item#}}


            搜索结果：

            {{#code_extract.result#}}

            '
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 1000
        selected: false
        structured_output: {}
        structured_output_enabled: false
        title: 网页小结
        type: llm
        vision:
          enabled: false
      height: 116
      id: llm_summary
      parentId: iteration_research
      position:
        x: 942
        y: 136.4873213559007
      positionAbsolute:
        x: 1902
        y: 276.4873213559007
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 1002
    - data:
        code: "def main(summaries: list) -> dict:\n    parts = []\n    idx = 0\n \
          \   for s in summaries or []:\n        s = str(s or \"\").strip()\n    \
          \    if not s:\n            continue\n        idx += 1\n        parts.append(f\"\
          【子课题 {idx}】\\n{s}\")\n    if not parts:\n        parts = [\"（未获得任何有效研究小结）\"\
          ]\n    return {\"report_input\": \"\\n\\n\".join(parts)}\n"
        code_language: python3
        desc: 将迭代输出的小结数组拼接为报告输入
        outputs:
          report_input:
            children: null
            type: string
        selected: false
        title: 汇总拼接
        type: code
        variables:
        - value_selector:
          - iteration_research
          - output
          variable: summaries
      height: 80
      id: code_join
      position:
        x: 2235.9651913317216
        y: 140
      positionAbsolute:
        x: 2235.9651913317216
        y: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 基于全部研究小结生成结构化研究报告
        model:
          completion_params:
            temperature: 0.4
          mode: chat
          name: qwen3.7-flash
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: f2000000-0000-4000-8000-000000000005
          role: system
          text: '你是一名资深研究员。请基于提供的各子课题研究小结，撰写一份结构化研究报告。


            报告使用 Markdown 格式，包含以下部分：

            ## 一、研究背景 —— 简述研究问题及其价值（2-3句）

            ## 二、关键发现 —— 按3-5个要点归纳各子课题的核心信息

            ## 三、综合分析 —— 交叉对比各来源信息，指出共识、分歧与信息缺口

            ## 四、结论与建议 —— 给出明确结论和后续行动建议

            ## 五、参考来源 —— 列出小结中出现的来源标题与URL


            要求：

            - 语言客观、信息密度高，总长度800-1200字；

            - 不得编造小结之外的事实，来源不足处如实说明；

            - 使用中文。

            '
        - id: f2000000-0000-4000-8000-000000000006
          role: user
          text: '研究问题：{{#start_node.query#}}


            各子课题研究小结：

            {{#code_join.report_input#}}

