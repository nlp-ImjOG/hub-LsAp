    - data:
        code: "import json\n\ndef main(iteration_output: list) -> dict:\n    all_findings\
          \ = []\n    all_urls = []\n\n    # 空输入兜底\n    if not iteration_output or\
          \ not isinstance(iteration_output, list):\n        return {\n          \
          \  \"all_findings\": [],\n            \"visited_urls\": [],\n          \
          \  \"search_rounds\": 0\n        }\n\n    for item in iteration_output:\n\
          \        # 兼容：元素是 JSON 字符串\n        if isinstance(item, str):\n        \
          \    try:\n                item = json.loads(item)\n            except Exception:\n\
          \                # 解析失败则当作纯文本总结\n                if item.strip():\n    \
          \                all_findings.append(item.strip())\n                continue\n\
          \n        if not isinstance(item, dict):\n            continue\n\n     \
          \   # 提取总结文本，兼容 summary / text 两种字段\n        summary = item.get(\"summary\"\
          ) or item.get(\"text\") or \"\"\n        if summary.strip():\n         \
          \   all_findings.append(summary.strip())\n\n        # 提取链接并全局去重\n      \
          \  urls = item.get(\"urls\", [])\n        if isinstance(urls, list):\n \
          \           for url in urls:\n                if isinstance(url, str) and\
          \ url and url not in all_urls:\n                    all_urls.append(url)\n\
          \n    return {\n        \"all_findings\": all_findings,\n        \"visited_urls\"\
          : all_urls,\n        \"search_rounds\": len(all_findings)\n    }\n"
