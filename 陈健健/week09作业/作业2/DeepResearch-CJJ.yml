    - data:
        code: "import json\n\ndef main(search_response: str):\n    try:\n        #\
          \ 1. 解析JSON字符串\n        if isinstance(search_response, str):\n         \
          \   data = json.loads(search_response)\n        elif isinstance(search_response,\
          \ dict):\n            data = search_response\n        else:\n          \
          \  return {\n                \"search_results\": [],\n                \"\
          urls\": [],\n                \"total\": 0,\n                \"error\": \"\
          输入类型错误\"\n            }\n\n        # 2. 兼容两种返回结构：直接返回数据 / 外层包裹code+data\n\
          \        if \"data\" in data and isinstance(data[\"data\"], dict):\n   \
          \         response_data = data[\"data\"]\n        else:\n            response_data\
          \ = data\n\n        # 3. 正确提取网页数组：webPages.value 才是真实的网页列表\n        web_pages_obj\
          \ = response_data.get(\"webPages\", {})\n        web_pages = web_pages_obj.get(\"\
          value\", [])\n        \n        # 兜底：确保是数组\n        if not isinstance(web_pages,\
          \ list):\n            web_pages = []\n\n        formatted = []\n       \
          \ urls = []\n\n        for idx, page in enumerate(web_pages):\n        \
          \    # 确保每个元素都是字典\n            if not isinstance(page, dict):\n        \
          \        continue\n            \n            url = page.get(\"url\", \"\"\
          )\n            formatted.append({\n                \"index\": idx + 1,\n\
          \                \"title\": page.get(\"name\", \"\"),\n                \"\
          url\": url,\n                \"snippet\": page.get(\"snippet\", \"\"),\n\
          \                \"summary\": page.get(\"summary\", \"\"),\n           \
          \     \"site\": page.get(\"siteName\", \"\")\n            })\n         \
          \   if url:\n                urls.append(url)\n\n        return {\n    \
          \        \"search_results\": formatted,\n            \"urls\": urls,\n \
          \           \"total\": len(formatted),\n            \"error\": \"\"\n  \
          \      }\n\n    except Exception as e:\n        return {\n            \"\
          search_results\": [],\n            \"urls\": [],\n            \"total\"\
          : 0,\n            \"error\": str(e)\n        }\n"
